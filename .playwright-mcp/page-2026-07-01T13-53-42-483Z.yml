                - generic [ref=f64e184]:
                  - text: "1 ToF post for reach. 3 MoF posts to prove it. 1 BoF post to convert. Here is the weekly content score we run, mapped to the tiered outbound strategy:"
                  - text: Most teams treat content and outbound as two separate jobs.
                  - text: We combine them instead.
                  - text: A post is not just a reach. It is a signal. The tier of the post, and how someone engages with it, decides who we reach out to + when + what we say.
                  - text: "Here’s how:"
                  - text: TIER 3, BoF, convert
                  - text: "↳ a real asset: a lead magnet, a case study result, a teardown with proof"
                  - text: ↳ With the highest intent, the people who engage here raised their hand
                  - text: "↳ The DM it earns: reach out within a day, name the thing they grabbed or if it’s not relevant, just keep your outreach short + sweet"
                  - text: TIER 2, MoF, prove
                  - text: ↳ How you think, how you solve a problem, a contrarian take with a method
                  - text: ↳ This is the workhorse; it makes the reader think you know your stuff
                  - text: "↳ The DM it earns: a personal note that references their comment, no pitch yet"
                  - text: TIER 1, ToF, reach
                  - text: ↳ a story or a stat that attracts and pulls a broader audience
                  - text: ↳ grows the top, new followers, future pipeline
                  - text: "↳ The DM it earns: none yet, a like is not a buying signal"
                  - text: TIER 0, skip
                  - text: ↳ posting for the sake of posting, no point of view, no asset
                  - text: ↳ it fills the feed and trains the algorithm on weak engagement
                  - text: The trap is not knowing your ICP enough. If that’s the case, it is very easy to spend creating content (in any format), chasing vanity metrics, and nothing is going to
                  - text: 1)drive inbound pipeline
                  - text: 2)speed up closing due to increased trust and education
                  - text: 3)attract talent, investors, and partners based on your goals
                  - text: "So we run a weekly split: mostly MoF to prove it, one ToF for reach, one BoF to convert. Then the engagement on each post feeds the same signal score our SDR is using for outbound, supported by GTM engineers."
                  - text: Content and outbound are not two jobs.
                  - text: They compound when they work together.
                  - text: What share of your posts last month were just reach?
                  - text: Comment SCORE, and I will send you the 4-tier framework we use for both.
                  - text: P.S. We build signal-based GTM engines for B2B teams, where content, ads, and outbound run on one score. If that is the motion you want, book a call through the site or DM me.
