                  - text: Most LinkedIn content doesn’t fail because it’s bad
                  - text: It fails because it never reaches the people it was written for
                  - text: "Here's what most creators get wrong:"
                  - text: They chase likes before quality
                  - text: They chase reach before relevance
                  - text: They chase DMs before trust
                  - text: "But a predictable lead pipeline follows a different path:"
                  - text: Content Quality → Engagement Depth → Audience Reach → Profile Visits → Conversations → Clients
                  - text: Every stage feeds the next
                  - text: A post that gets 50 likes and 20 saves is often more valuable than a post with 500 likes and no buying intent
                  - text: Because leads don't come from vanity metrics
                  - text: They come from moving the right people through the right stages
                  - text: "Inside this infographic, I break down:"
                  - text: • How LinkedIn evaluates your content
                  - text: • Why saves matter more than likes
                  - text: • How to push beyond your existing network
                  - text: • The profile optimization mistake killing conversions
                  - text: • How content turns into inbound DMs
                  - text: If you're posting consistently but not seeing business results, your pipeline is probably leaking at one of these stages
                  - text: Dm me "Content" and ill help you generate a consistent lead pipeline with visual content
