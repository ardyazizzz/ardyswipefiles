                  - text: "\"My ICP isn't seeing my content anymore\""
                  - text: Here's a quick fix for that ↓
                  - text: Last year, I was still fully focused on PLG
                  - text: My feed reflected that.
                  - text: "I mainly saw posts from:"
                  - text: SaaS founder
                  - text: PLG peers.
                  - text: But LinkedIn has introduced its own LLM called 360Brew.
                  - text: With that, it makes the feed behave more like a “For You” page.
                  - text: Quite similar to TikTok/Instagram/etc.
                  - text: So, because I've made the switch to helping B2B SaaS founders and consultants with LI.
                  - text: LI has placed me in a different bucket.
                  - text: The coaching bucket.
                  - text: And because of that, I don't see posts anymore from leading SaaS, and PLG creators.
                  - text: "Instead, it shows me posts from:"
                  - text: "- Jasmin Alic"
                  - text: "- Lara Acosta"
                  - text: "- Nick Broekma"
                  - text: "- Daniel Korenblum"
                  - text: Super valuable, but I still like to catch up on SaaS and PLG.
                  - text: Not only that.
                  - text: Many SaaS consultants (my ICP) are in that bucket, so I still want to interact with them.
                  - text: "Here's how I fixed that:"
                  - text: 1. Go to the person's profile
                  - text: 2. Click on the 2 bells in the top right corner
                  - text: "3. You see a pop-up: Manage notifications about [name]"
                  - text: 4. Select 'Everything'
                  - text: 5. Save
                  - text: You can do this with your ICP and peers from people who aren't in your 'bucket'
                  - text: Interact with that post, and leave a valuable comment.
                  - text: The algorithm may not show your post to the right people.
                  - text: But your comments still can.
                  - text: When you comment, you can share value directly with your ICP.
                  - text: Try it out, and see your feed adapt.
