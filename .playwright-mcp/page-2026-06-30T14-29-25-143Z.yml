            - button [ref=e54] [cursor=pointer]
          - paragraph [ref=e56]: "\"My ICP isn't seeing my content anymore\" Here's a quick fix for that ↓ Last year, I was still fully focused on PLG My feed reflected that. I mainly saw posts from: SaaS founder PLG peers. But LinkedIn has introduced its own LLM called 360Brew. With that, it makes the feed behave more like a “For You” page. Quite similar to TikTok/Instagram/etc. So, because I've made the switch to helping B2B SaaS founders and consultants with LI. LI has placed me in a different bucket. The coaching bucket. And because of that, I don't see posts anymore from leading SaaS, and PLG creators. Instead, it shows me posts from: - Jasmin Alic - Lara Acosta - Nick Broekma - Daniel Korenblum Super valuable, but I still like to catch up on SaaS and PLG. Not only that. Many SaaS consultants (my ICP) are in that bucket, so I still want to interact with them. Here's how I fixed that: 1. Go to the person's profile 2. Click on the 2 bells in the top right corner 3. You see a pop-up: Manage notifications about [name] 4. Select 'Everything' 5. Save You can do this with your ICP and peers from people who aren't in your 'bucket' Interact with that post, and leave a valuable comment. The algorithm may not show your post to the right people. But your comments still can. When you comment, you can share value directly with your ICP. Try it out, and see your feed adapt."
