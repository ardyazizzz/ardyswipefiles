                    - text: Alex Turnbull
                  - text: "built two SaaS companies to $10M+ ARR. No co-founder. No funding. No ads. Just LinkedIn + daily posting. Here's his playbook: YEAR 1: Groove (customer support SaaS) → Built MVP solo → Posted build updates on LinkedIn → Hit $100K ARR (40% from LinkedIn organic) YEAR 2-5: Scaled Groove to $5M ARR → Posted every single day → Shared metrics, churn fixes, mistakes → Grew 42K followers (no ghostwriter) YEAR 6+: Launched SaaS Academy → Used same playbook → $5M ARR in 3 years → Combined: $10M+ ARR empire HIS Content Strategy: Posted 3 types: 1. Contrarian hooks (viral) \"I regret raising money\" Result: 500K views 2. Authority builders (trust) \"I scaled to $5M ARR. Here's how\" Result: Converted 20% to trials 3. Building in public (relatability) \"Last month we lost 50 customers. Here's why\" Result: Users said \"I bought because of your posts\" No Hacks. NO Tricks. Just consistent value + transparency. The Lesson: Distribution > Product quality. You can build the best SaaS in the world. If nobody knows you exist, you make $0. Alex's product was his content. His content sold his actual product. SaaS founders: Are you building in silence or building in public?"
