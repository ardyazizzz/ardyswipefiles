                        - /url: https://uk.linkedin.com/in/amangrowth?trk=public_post_feed-actor-name
                        - text: Aman Ghataura
                      - time [ref=e584]: 4mo
                  - button [ref=e587] [cursor=pointer]
                - paragraph [ref=e589]: "Series B SaaS lead asked me today: \"What do you do if post impressions were low\" Here's what I don't do: - Think the post sucks - Think I'm shadow banned - Think low impressions are a bad thing Post impressions are a function of 5 things In order of importance - Idea - Written hook - Image - Content - Formatting I will work all the way back up the pyramid And ask myself: Did the idea deserve those impressions? And here's where it gets subjective... A post about a client case studies deserves low impressions. You're not entertaining or educating without self interest... So why should LinkedIn push it? So yeah if you got 'low' impressions then it was fully deserved. Nothing is wrong or broken. But hey if your goal is to get high impressions Then just write a high impression idea post - Hiring - Rage bait - Personal journey - How much money you make - Something to trigger people I promise you it's that easy But then you're going to realize, very quickly - that impressions alone are NOT your goal. They never were and never are. If you've learnt this and don't know where to go next. And want to increase your QUALIFIED IMPRESSIONS (yes that's a thing) Then go through my profile and read some more posts Don't DM me yet... It's not the right time"
